name: inventree-ai

# Deployment scaffold: supply an image implementing docs/deployment/runtime-contract.md.
# No MCP image is built or published by this repository yet.
services:
  mcp:
    image: ${MCP_IMAGE:?Set the tested InvenTree-AI image reference}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=67108864,mode=1777
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PUBLIC_URL: https://${MCP_DOMAIN:?Set the public MCP domain}/mcp
      MCP_AUTH_REQUIRED: "true"
      MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL:?Set the HTTPS OAuth issuer URL}
      MCP_AUTH_AUDIENCE: ${MCP_AUTH_AUDIENCE:?Set the audience issued for this MCP service}
      MCP_AUTH_POLICY_FILE: /run/secrets/authorization-policy.json
      INVENTREE_URL: ${INVENTREE_URL:?Set the InvenTree API base URL}
      INVENTREE_TOKEN_FILE: /run/secrets/inventree-token
    secrets:
      - source: inventree_token
        target: inventree-token
      - source: authorization_policy
        target: authorization-policy.json
    expose: ["8000"]
    networks: [backend]
    # The image must provide this executable; no curl/python assumption is made.
    healthcheck:
      test: [CMD, /usr/local/bin/inventree-ai-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    image: ${CADDY_IMAGE:?Set a pinned official Caddy image reference}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set the public MCP domain}
    # Public binding is an explicit deployment choice after runtime auth testing.
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16777216,mode=1777
    depends_on:
      mcp:
        condition: service_healthy
    networks: [backend]

networks:
  backend: {}

volumes:
  caddy_data: {}
  caddy_config: {}

secrets:
  inventree_token:
    file: ${INVENTREE_TOKEN_FILE:?Set the local secret file path}
  authorization_policy:
    file: ${MCP_AUTH_POLICY_FILE:?Set the local authorization policy file path}
