apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventree-ai.name" . }}
  labels:
    {{- include "inventree-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "inventree-ai.selectorLabels" . | nindent 4 }}
