apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventree-ai.name" . }}
  labels:
    {{- include "inventree-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "inventree-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventree-ai.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ required "image.reference is required" .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: MCP_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: MCP_AUTH_REQUIRED
              value: "true"
            - name: MCP_AUTH_MODE
              value: inventree-token
            - name: MCP_AUTH_ISSUER_URL
              value: {{ trimSuffix "/mcp" .Values.publicUrl | quote }}
            - name: MCP_AUTH_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: MCP_AUTH_BROKER_CONFIG_FILE
              value: /run/secrets/auth-broker.json
            - name: INVENTREE_URL
              value: {{ .Values.inventreeUrl | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: {{ required "existingSecret is required" .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: auth-broker.json
                path: auth-broker.json
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
