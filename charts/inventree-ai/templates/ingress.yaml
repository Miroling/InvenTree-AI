{{- if .Values.ingress.enabled }}
{{- if ne .Values.publicUrl (printf "https://%s/mcp" .Values.ingress.host) }}
{{- fail "publicUrl must equal https://<ingress.host>/mcp when ingress is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "inventree-ai.name" . }}
  labels:
    {{- include "inventree-ai.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "inventree-ai.name" . }}
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ include "inventree-ai.name" . }}
                port:
                  name: http
{{- end }}
